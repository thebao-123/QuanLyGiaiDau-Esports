<div class="kpi-grid">
  <div class="kpi-card">
    <div class="kpi-label">Tổng tài khoản</div>
    <div class="kpi-value" id="kpi-total-users">0</div>
    <div class="kpi-sub">Người dùng trên hệ thống</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Đang hoạt động</div>
    <div class="kpi-value" id="kpi-active-users">0</div>
    <div class="kpi-sub">Trạng thái ACTIVE</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Ban điều hành & Trọng tài</div>
    <div class="kpi-value" id="kpi-staff-users">0</div>
    <div class="kpi-sub">Admin / BTC / Trọng tài</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Tài khoản bị khóa</div>
    <div class="kpi-value" id="kpi-suspended-users">0</div>
    <div class="kpi-sub">Trạng thái SUSPENDED</div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h3 class="card-title">Danh sách tài khoản người dùng</h3>
    <div class="toolbar">
      <input type="text" id="search-user" class="form-input" style="width:230px;" placeholder="Tìm họ tên hoặc email..." />
      <select id="filter-user-role" class="form-select" style="width:190px;">
        <option value="ALL">Tất cả vai trò</option>
        <option value="ADMIN">Quản trị viên (ADMIN)</option>
        <option value="ORGANIZER">Ban tổ chức (ORGANIZER)</option>
        <option value="REGIONAL_COORDINATOR">Điều phối khu vực</option>
        <option value="REFEREE">Trọng tài (REFEREE)</option>
        <option value="TEAM_CAPTAIN">Đội trưởng (TEAM_CAPTAIN)</option>
        <option value="VIEWER">Khán giả (VIEWER)</option>
      </select>
      <button id="btn-open-user-modal" class="btn btn-primary">+ Cấp tài khoản</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Họ và tên</th>
          <th>Email</th>
          <th>Số điện thoại</th>
          <th>Vai trò</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="accounts-table-body"></tbody>
    </table>
  </div>
</div>

<!-- Modal tạo tài khoản mới -->
<div id="user-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); align-items:center; justify-content:center; z-index:999;">
  <div class="card" style="width:100%; max-width:460px; margin:0 16px;">
    <div class="card-header">
      <h3 class="card-title">Tạo tài khoản mới</h3>
      <button type="button" id="btn-close-user-modal" class="btn btn-outline btn-sm">✕</button>
    </div>
    <form id="form-create-user">
      <div class="form-group">
        <label class="form-label">Họ và tên *</label>
        <input type="text" id="inp-user-name" class="form-input" required placeholder="VD: Nguyễn Văn An" />
      </div>
      <div class="form-group">
        <label class="form-label">Email đăng nhập *</label>
        <input type="email" id="inp-user-email" class="form-input" required placeholder="VD: referee3@esports.vn" />
      </div>
      <div class="form-group">
        <label class="form-label">Số điện thoại</label>
        <input type="text" id="inp-user-phone" class="form-input" placeholder="0901234567" />
      </div>
      <div class="form-group">
        <label class="form-label">Vai trò hệ thống *</label>
        <select id="inp-user-role" class="form-select">
          <option value="ORGANIZER">Ban tổ chức (ORGANIZER)</option>
          <option value="REGIONAL_COORDINATOR">Điều phối khu vực (REGIONAL_COORDINATOR)</option>
          <option value="REFEREE">Trọng tài (REFEREE)</option>
          <option value="TEAM_CAPTAIN">Đội trưởng (TEAM_CAPTAIN)</option>
          <option value="VIEWER">Khán giả (VIEWER)</option>
          <option value="ADMIN">Quản trị viên (ADMIN)</option>
        </select>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
        <button type="button" id="btn-cancel-user-modal" class="btn btn-outline">Hủy</button>
        <button type="submit" class="btn btn-primary">Lưu tài khoản</button>
      </div>
    </form>
  </div>
</div>
